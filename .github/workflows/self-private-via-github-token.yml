name: One-time self privatize

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/self-private-via-github-token.yml

permissions: write-all

concurrency:
  group: one-time-self-private
  cancel-in-progress: false

jobs:
  privatize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make this repository private
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/self-private-via-github-token.yml
        run: |
          set -euo pipefail

          response_file="$RUNNER_TEMP/repository-update.json"
          http_status="$(
            curl -sS -L \
              -o "$response_file" \
              -w '%{http_code}' \
              -X PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" \
              -d '{"private":true}'
          )"

          if [[ "$http_status" != "200" ]]; then
            echo "Repository visibility update failed with HTTP $http_status."
            jq -r '.message // "No API error message"' "$response_file" || true
            exit 1
          fi

          if [[ "$(jq -r '.private' "$response_file")" != "true" ]]; then
            echo "GitHub returned success but repository is not private."
            exit 1
          fi

          echo "Repository is private."

      - name: Remove this one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/self-private-via-github-token.yml
        run: |
          set -euo pipefail

          workflow_sha="$(
            curl -fsS -L \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=$GITHUB_REF_NAME" \
              | jq -r '.sha'
          )"

          delete_payload="$(jq -nc \
            --arg message 'chore: remove one-time privacy workflow' \
            --arg sha "$workflow_sha" \
            --arg branch "$GITHUB_REF_NAME" \
            '{message: $message, sha: $sha, branch: $branch}')"

          curl -fsS -L \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH" \
            -d "$delete_payload" >/dev/null

          echo "One-time workflow removed."

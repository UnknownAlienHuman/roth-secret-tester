name: Retail 12.1 safe-boundary validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Parse safe boundary and regression
        run: |
          luac5.1 -p safe.lua
          luac5.1 -p tests/safe_12_1_spec.lua

      - name: Run inaccessible-proxy regression
        run: lua5.1 tests/safe_12_1_spec.lua safe.lua

      - name: Enforce boundary vocabulary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          safe = Path('safe.lua').read_text(encoding='utf-8')
          required = [
              'CanAccessValue',
              'canaccessvalue',
              '<inaccessible>',
              '<secret>',
              'inaccessiblePlaceholder',
              'secretPlaceholder',
              'maxItems',
              '<cycle>',
          ]
          missing = [token for token in required if token not in safe]
          if missing:
              raise SystemExit(f'Missing safe-boundary contracts: {missing}')

          forbidden = ['scrubsecretvalues']
          found = [token for token in forbidden if token in safe]
          if found:
              raise SystemExit(f'Forbidden declassification vocabulary: {found}')

          toc = Path('RothSecretTester.toc').read_text(encoding='utf-8')
          assert '## Interface: 120100' in toc
          assert '## Version: 1.7.0' in toc
          print('Safe boundary: PASS')
          PY
